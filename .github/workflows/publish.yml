name: Bee-Plus CI/CD

# 触发机制：
# 1. 向 main 分支推送代码时 -> 跑测试 (CI)
# 2. 推送 v*.*.* 格式的 tag 时 (如 v1.0.3) -> 跑测试 + 打包 + 发布到 NPM (CD)
on:
  push:
    branches:
      - 'release/online' # 只要推送到 release/online 分支就触发发布
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'release/online' # 监控对此分支的 PR，只跑测试

jobs:
  # 任务 1：代码质检 (CI)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 安装 PNPM
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # 使用 pnpm 缓存

      - name: Install Dependencies
        run: pnpm install

      - name: Run Unit Tests
        run: npm run test

  # 任务 2：构建与发布 (CD)
  publish:
    needs: test
    # 条件：是 v 开头的 tag，或者 是 release/online 分支的推送
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/online'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 安装 PNPM
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # 使用 pnpm 缓存
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: pnpm install

      - name: Build Project
        run: npm run build

      - name: Generate Types
        run: npm run build:types

      - name: Publish to NPM
        working-directory: packages/bee-plus
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
